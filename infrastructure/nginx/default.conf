# Camacho POS Colombia — reverse proxy proposal
# Domains below are PROPOSALS for camachoposcolombia.com.
# Do NOT treat this file as proof that DNS or TLS are configured.
#
# Intended topology (proposal):
#   camachoposcolombia.com / www → web (Next.js :3000)
#   api.camachoposcolombia.com   → commercial-api (:4000)
#   staging.camachoposcolombia.com → staging stack (noindex)

upstream commercial_web {
    server web:3000;
    keepalive 32;
}

upstream commercial_api {
    server commercial-api:4000;
    keepalive 32;
}

# WWW → apex 301
server {
    listen 80;
    server_name www.camachoposcolombia.com;
    return 301 https://camachoposcolombia.com$request_uri;
}

# Apex — marketing / portal
server {
    listen 80;
    server_name camachoposcolombia.com;

    # TLS termination is expected at the edge (certbot / load balancer).
    # When this vhost is used only on Docker profile with-nginx (host :8080),
    # HTTP is intentional for local smoke tests.

    client_max_body_size 10m;

    location / {
        proxy_pass http://commercial_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API subdomain proposal
server {
    listen 80;
    server_name api.camachoposcolombia.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://commercial_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://commercial_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# Staging — always noindex (proposal hostname)
server {
    listen 80;
    server_name staging.camachoposcolombia.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://commercial_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    location /v1/ {
        proxy_pass http://commercial_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default catch-all for Docker profile with-nginx (Host: localhost / 127.0.0.1)
server {
    listen 80 default_server;
    server_name _;

    location /health {
        proxy_pass http://commercial_api/health;
    }

    location /v1/ {
        proxy_pass http://commercial_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://commercial_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
