name: Secret history cleanup rehearsal
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify selective cleanup on disposable local mirror
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d "$RUNNER_TEMP/history-rehearsal.XXXXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          python3 -m venv "$temp/venv"
          "$temp/venv/bin/pip" install --disable-pip-version-check git-filter-repo==2.47.0
          before="$(git rev-parse HEAD^{tree})"
          if git ls-tree -r --name-only HEAD -- apps/web/.next/ | grep -q .; then
            echo "Reviewed tree still contains generated Next files"
            exit 1
          fi
          git update-ref refs/heads/security-rehearsal-input HEAD
          git clone --quiet --mirror --no-local "$GITHUB_WORKSPACE" "$temp/mirror.git"
          git -C "$temp/mirror.git" remote remove origin
          if ! (cd "$temp/mirror.git" && "$temp/venv/bin/git-filter-repo" --force --path apps/web/.next/ --invert-paths) >"$temp/filter.log" 2>&1; then
            echo "Local history filtering failed; no remote changes made"
            exit 1
          fi
          after="$(git -C "$temp/mirror.git" rev-parse refs/heads/security-rehearsal-input^{tree})"
          test "$before" = "$after"
          test -z "$(git -C "$temp/mirror.git" rev-list --all -- apps/web/.next/)"
          echo "Reviewed HEAD tree identical; generated path absent from reachable mirror history"
          git -C "$temp/mirror.git" fsck --full --no-reflogs >"$temp/fsck.log" 2>&1
          docker pull ghcr.io/gitleaks/gitleaks:v8.24.2
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$temp/mirror.git:/repo:ro" -v "$temp:/report" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git --redact=100 --exit-code=42 \
            --report-format=json --report-path=/report/findings.json --log-opts="--all" /repo \
            >"$temp/scan.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 42 ]; then
            echo "Scanner execution failed (exit $status)"
            exit "$status"
          fi
          python3 - "$temp/findings.json" "$status" <<'PY'
          import json, pathlib, sys
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text()) or []
          print("Occurrences after local rehearsal:", len(findings))
          for finding in findings:
              print(json.dumps({k: finding.get(k) for k in ("RuleID", "File", "StartLine", "Commit")}, ensure_ascii=True))
          if findings or int(sys.argv[2]) != 0:
              raise SystemExit(1)
          PY
          echo "Local rehearsal only. No remote push, artifact upload, credential rotation or incident closure."
