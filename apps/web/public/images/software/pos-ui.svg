<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Interfaz de caja Camacho POS">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2b3d"/>
      <stop offset="100%" stop-color="#0b1a2c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fb"/>
      <stop offset="100%" stop-color="#e8edf2"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="#0b1a2c"/>
  <rect x="48" y="36" width="864" height="612" rx="18" fill="url(#bezel)"/>
  <rect x="72" y="60" width="816" height="540" rx="8" fill="url(#screen)"/>
  <!-- top bar -->
  <rect x="72" y="60" width="816" height="56" fill="#0b1a2c"/>
  <text x="96" y="96" fill="#f0b429" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Camacho POS · Caja 01</text>
  <text x="720" y="96" fill="#6ee7d8" font-family="Arial, Helvetica, sans-serif" font-size="16">Operador: Ana</text>
  <!-- catalog -->
  <rect x="96" y="140" width="420" height="420" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="116" y="172" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Catálogo rápido</text>
  <rect x="116" y="192" width="180" height="100" rx="8" fill="#eef6f5" stroke="#0d6e66"/>
  <text x="130" y="230" fill="#0d6e66" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Arroz 500g</text>
  <text x="130" y="254" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">$ 3.200</text>
  <rect x="316" y="192" width="180" height="100" rx="8" fill="#fff8e8" stroke="#f0b429"/>
  <text x="330" y="230" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Aceite 1L</text>
  <text x="330" y="254" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">$ 12.900</text>
  <rect x="116" y="312" width="180" height="100" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="130" y="350" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Leche 1L</text>
  <text x="130" y="374" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">$ 4.150</text>
  <rect x="316" y="312" width="180" height="100" rx="8" fill="#ffffff" stroke="#d5dde6"/>
  <text x="330" y="350" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Pan tajado</text>
  <text x="330" y="374" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">$ 5.600</text>
  <rect x="116" y="432" width="380" height="48" rx="8" fill="#0d6e66"/>
  <text x="140" y="462" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Buscar por código / nombre</text>
  <!-- ticket -->
  <rect x="540" y="140" width="324" height="420" rx="10" fill="#ffffff" stroke="#d5dde6"/>
  <text x="560" y="172" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Ticket actual</text>
  <text x="560" y="210" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">2 × Arroz 500g</text>
  <text x="780" y="210" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">$ 6.400</text>
  <text x="560" y="238" fill="#445668" font-family="Arial, Helvetica, sans-serif" font-size="14">1 × Aceite 1L</text>
  <text x="780" y="238" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">$ 12.900</text>
  <line x1="560" y1="260" x2="844" y2="260" stroke="#d5dde6"/>
  <text x="560" y="300" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Total</text>
  <text x="760" y="300" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">$ 19.300</text>
  <rect x="560" y="340" width="284" height="56" rx="8" fill="#f0b429"/>
  <text x="640" y="375" fill="#0b1a2c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Cobrar</text>
  <rect x="560" y="412" width="136" height="44" rx="8" fill="#eef2f6"/>
  <text x="590" y="440" fill="#1e3a4f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Efectivo</text>
  <rect x="708" y="412" width="136" height="44" rx="8" fill="#eef2f6"/>
  <text x="748" y="440" fill="#1e3a4f" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Tarjeta</text>
  <text x="560" y="500" fill="#0d6e66" font-family="Arial, Helvetica, sans-serif" font-size="13">Modo local-first · sync pendiente 0</text>
  <!-- stand -->
  <rect x="390" y="648" width="180" height="18" rx="4" fill="#1e3a4f"/>
  <rect x="430" y="612" width="100" height="36" fill="#1e3a4f"/>
